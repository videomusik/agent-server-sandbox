# The sandbox's SSH server. Debian's sshd_config includes this file first, and the first value sshd
# reads for a setting is the one it uses.

# Its own host key, kept in a volume so that rebuilding the container does not change it.
HostKey /etc/ssh/sandbox_keys/ssh_host_ed25519_key

# Only the user dev, only with a key.
AllowUsers dev
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthorizedKeysFile .ssh/authorized_keys

# Nothing from your own computer's SSH agent reaches the container, even if the client asks to
# forward it.
AllowAgentForwarding no
X11Forwarding no
PermitUserEnvironment no

# VS Code Remote-SSH talks to its server through a local port forward, so this stays allowed.
AllowTcpForwarding local

# Notice a dropped connection within a few minutes.
ClientAliveInterval 60
ClientAliveCountMax 3

PrintMotd no
